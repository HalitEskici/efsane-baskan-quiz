<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ne Tür Bir Başkansın? — Efsane Başkan</title>
<meta name="description" content="Beş soru. İki eksen. Efsane Başkan'da hangi yönetici tipisin?">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#0A1220; --bg-bot:#050A14;
    --gold:#E8C87A; --gold-hi:#F5DFA8; --steel:#2C4763;
    --line:rgba(232,200,122,.22); --ink:#FFFFFF; --muted:rgba(255,255,255,.62);
    --card:rgba(255,255,255,.035);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* must win over the display values set on .screen / .badge below */
  [hidden]{display:none !important}
  html,body{min-height:100%}
  body{
    background:radial-gradient(120% 70% at 50% 0%,#12203a 0%,var(--bg-top) 42%,var(--bg-bot) 100%) no-repeat fixed var(--bg-bot);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
    padding:28px 20px 48px;
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;
  }
  /* margin:auto centres the column only when there is spare room. Because
     the body is min-height (not height) it grows with tall content, the
     auto margins collapse to 0, and the top stays reachable on short
     screens instead of being clipped the way align-items:center clips. */
  .app{width:100%;max-width:480px;margin:auto}
  h1,h2,.persona-name{font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-weight:700;letter-spacing:.2px}
  .screen{animation:fade .28s ease both}
  .fading{opacity:0;transform:translateY(6px);transition:opacity .16s ease,transform .16s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.screen,.fading{animation:none;transition:none;opacity:1;transform:none}}

  /* Strings are stored pre-cased in i18n and rendered verbatim. No
     text-transform anywhere: under lang="tr" it applies Turkish casing
     (i -> İ) and would mangle the English labels, and vice versa. */
  .eyebrow{font-size:11px;letter-spacing:.24em;color:var(--gold);font-weight:600}

  /* Language toggle — owns its own row at the top of the column, so no
     screen's content can ever share that band with it. */
  .topbar{display:flex;justify-content:flex-end;margin-bottom:18px}
  .lang{display:flex;align-items:center;gap:7px}
  .lang button{font-size:11px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.38);
    padding:4px 2px;transition:color .18s ease}
  .lang button[aria-pressed="true"]{color:var(--gold)}
  .lang button:hover{color:var(--gold-hi)}
  .lang .sep{color:rgba(255,255,255,.18);font-size:11px}

  /* Intro */
  .crest{width:56px;height:56px;margin:0 auto 22px;border:1px solid var(--line);border-radius:50%;
    display:grid;place-items:center;color:var(--gold);font-family:'Playfair Display',serif;font-size:22px;
    background:rgba(232,200,122,.05);box-shadow:0 0 32px rgba(232,200,122,.10) inset}
  #intro{text-align:center}
  #intro h1{font-size:38px;line-height:1.12;margin:14px 0 16px;white-space:pre-line;
    background:linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,#b9954c);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .lede{color:var(--muted);font-size:15px;max-width:340px;margin:0 auto 30px}

  /* Buttons */
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  .btn{display:block;width:100%;padding:15px 18px;border-radius:12px;font-weight:600;font-size:15px;
    transition:transform .12s ease,background .18s ease,border-color .18s ease}
  .btn-primary{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#10182a;
    box-shadow:0 10px 30px -12px rgba(232,200,122,.6)}
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  :focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px;border-radius:12px}

  /* Quiz */
  /* step number sits at the right end of the label row, sharing its baseline */
  .progress-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
  .track{height:2px;background:rgba(255,255,255,.10);border-radius:2px;overflow:hidden;margin-bottom:30px}
  .track span{display:block;height:100%;background:linear-gradient(90deg,var(--steel),var(--gold));
    border-radius:2px;transition:width .35s cubic-bezier(.4,0,.2,1)}
  #qtext{font-size:26px;line-height:1.25;margin-bottom:24px}
  .options{display:grid;gap:10px}
  .opt{width:100%;text-align:left;padding:16px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.10);
    background:var(--card);font-size:15px;line-height:1.45;display:flex;gap:13px;align-items:flex-start;
    transition:border-color .18s ease,background .18s ease,transform .12s ease}
  .opt .key{color:var(--gold);font-weight:700;font-size:12px;letter-spacing:.1em;padding-top:2px;flex:0 0 auto}
  .opt:hover,.opt:focus-visible{border-color:var(--line);background:rgba(232,200,122,.07);transform:translateY(-1px)}

  /* Result */
  .card{border:1px solid var(--line);border-radius:18px;padding:28px 24px;text-align:center;
    background:linear-gradient(180deg,rgba(44,71,99,.34),rgba(255,255,255,.02));
    box-shadow:0 24px 60px -30px rgba(0,0,0,.9)}
  .badge{display:inline-block;font-size:10px;letter-spacing:.22em;font-weight:700;color:var(--gold-hi);
    border:1px solid var(--line);border-radius:999px;padding:4px 11px;margin-bottom:14px;
    background:rgba(232,200,122,.08)}
  .persona-name{font-size:33px;line-height:1.15;margin-bottom:16px;
    background:linear-gradient(180deg,var(--gold-hi),var(--gold) 65%,#c2a05a);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .desc{color:rgba(255,255,255,.80);font-size:15px;text-align:left}
  .sig{margin-top:20px;padding-top:18px;border-top:1px solid rgba(255,255,255,.10);text-align:left}
  .sig p{font-size:15px;color:var(--gold-hi);font-style:italic;margin-top:5px}

  .axes{margin-top:22px;display:grid;gap:18px}
  .axis-labels{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.16em;
    color:var(--muted);margin-bottom:8px}
  .axis-labels .on{color:var(--gold)}
  .meter{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.06)}
  .meter i{position:absolute;top:-3px;bottom:-3px;left:50%;width:1px;background:rgba(255,255,255,.22)}
  .meter b{position:absolute;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;
    background:var(--gold-hi);box-shadow:0 0 0 4px rgba(232,200,122,.16),0 0 16px rgba(232,200,122,.5);
    transition:left .5s cubic-bezier(.4,0,.2,1)}
  .actions{margin-top:26px}
  .share-row{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
  .icon-btn{width:46px;height:46px;border-radius:12px;border:1px solid rgba(255,255,255,.14);
    background:var(--card);display:grid;place-items:center;color:var(--gold);
    transition:border-color .18s ease,background .18s ease,transform .12s ease}
  .icon-btn:hover{border-color:var(--line);background:rgba(232,200,122,.08);transform:translateY(-1px)}
  .icon-btn svg{width:20px;height:20px;display:block;fill:none;stroke:currentColor;
    stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .note{text-align:center;font-size:12px;color:var(--muted);min-height:18px;margin-top:14px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<main class="app">

  <header class="topbar">
    <div class="lang" id="lang">
      <button type="button" data-lang="tr">TR</button>
      <span class="sep" aria-hidden="true">|</span>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <section class="screen" id="intro">
    <div class="crest" aria-hidden="true">EB</div>
    <p class="eyebrow" id="introBrand"></p>
    <h1 id="introTitle"></h1>
    <p class="lede" id="introLede"></p>
    <button class="btn btn-primary" id="startBtn" type="button"></button>
  </section>

  <section class="screen" id="quiz" hidden>
    <div class="progress-row">
      <p class="eyebrow" id="progress"></p>
      <p class="eyebrow" id="counter" style="color:rgba(255,255,255,.35)"></p>
    </div>
    <div class="track"><span id="bar" style="width:0%"></span></div>
    <h2 id="qtext" tabindex="-1"></h2>
    <div class="options" id="options" role="group" aria-labelledby="qtext"></div>
    <p class="sr" id="live" role="status" aria-live="polite"></p>
  </section>

  <section class="screen" id="result" hidden>
    <p class="eyebrow" id="resultLabel" style="text-align:center;margin-bottom:16px"></p>
    <div class="card">
      <p class="badge" id="rare" hidden></p>
      <h2 class="persona-name" id="pName" tabindex="-1"></h2>
      <p class="desc" id="pDesc"></p>
      <div class="sig">
        <p class="eyebrow" id="sigLabel"></p>
        <p id="pSig"></p>
      </div>
      <div class="axes">
        <div>
          <div class="axis-labels"><span id="lxA"></span><span id="lxB"></span></div>
          <div class="meter"><i></i><b id="dotX" style="left:50%"></b></div>
        </div>
        <div>
          <div class="axis-labels"><span id="lyA"></span><span id="lyB"></span></div>
          <div class="meter"><i></i><b id="dotY" style="left:50%"></b></div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="againBtn" type="button"></button>
      <div class="share-row" id="shareRow"></div>
    </div>
    <p class="note" id="note"></p>
  </section>

</main>

    telegram: '<path d="M17.6 3.3 2.7 9.2c-.7.3-.7 1.2 0 1.4l3.8 1.2 1.4 4.3c.2.6.9.7 1.3.3l2-2.1 3.8 2.8c.5.3 1.1.1 1.2-.5l2.3-12.1c.1-.6-.4-1.1-.9-1z"/><path d="m6.5 11.8 9.5-6.6-6.7 7.7"/>',
    x: '<path d="M4.2 3.6h3.1l9.5 12.8h-3.1z"/><path d="M16.3 3.6 11.4 9.1M8.7 11.1l-4.9 5.3"/>',
    whatsapp: '<path d="M3.4 16.6 4.6 13a6.7 6.7 0 1 1 2.5 2.5z"/><path d="M7.7 7.5c.2-.4.4-.4.6-.4h.5c.2 0 .4 0 .6.5l.6 1.5c.1.2 0 .4-.1.5l-.4.4c-.1.2-.2.3 0 .6.3.5.9 1.3 1.9 1.8.3.2.5.1.6 0l.5-.5c.1-.2.3-.1.5 0l1.4.7c.2.1.3.2.3.4 0 .2-.1.7-.4 1-.3.3-.8.4-1.2.4-2.2 0-5-2.8-5.5-4.4-.2-.7-.2-1.5.1-2.1z"/>',
    copy: '<rect x="7" y="7" width="9.5" height="9.5" rx="2.2"/><path d="M13 4.5H5.7a2.2 2.2 0 0 0-2.2 2.2V13"/>',
    share: '<circle cx="15" cy="5" r="2.1"/><circle cx="5" cy="10" r="2.1"/><circle cx="15" cy="15" r="2.1"/><path d="M13.1 6.1 6.9 8.9M6.9 11.1l6.2 2.8"/>'
  };

  /* ------------------------------------------------------------ state */
  var lang = "tr";                  /* in memory only — no storage APIs */
  var current = "intro";
  var step = 0, score = { x: 0, y: 0 }, persona = null, locked = false;

  var el = function (id) { return document.getElementById(id); };
  var screens = { intro: el("intro"), quiz: el("quiz"), result: el("result") };
  var T = function () { return i18n[lang]; };

  function show(name) {
    current = name;
    for (var k in screens) { screens[k].hidden = (k !== name); }
  }

  function resolve(x, y) {
    if (Math.abs(x) <= BALANCED && Math.abs(y) <= BALANCED) { return "chairman"; }
    if (x < 0) { return y < 0 ? "tactician" : "chaos"; }
    return y < 0 ? "architect" : "dealmaker";
  }

  function shareText() { return T().shareText.replace("{p}", T().personas[persona].name); }
  function pageUrl() { return location.href.split("#")[0]; }

  /* ----------------------------------------------------------- render */
  function renderChrome() {
    var t = T();
    document.documentElement.lang = t.htmlLang;
    document.title = t.docTitle;
    el("lang").setAttribute("aria-label", t.aria.lang);
    var btns = el("lang").querySelectorAll("button");
    for (var i = 0; i < btns.length; i++) {
      var code = btns[i].getAttribute("data-lang");
      btns[i].setAttribute("aria-pressed", String(code === lang));
      btns[i].setAttribute("aria-label", code === "tr" ? t.aria.langTr : t.aria.langEn);
    }
  }

  function renderIntro() {
    var t = T();
    el("introBrand").textContent = t.brand;
    el("introTitle").textContent = t.title;
    el("introLede").textContent = t.lede;
    el("startBtn").textContent = t.start;
  }

  function renderQuestion() {
    var t = T(), item = t.questions[step];
    el("progress").textContent = t.progress.replace("{n}", step + 1).replace("{t}", TOTAL);
    el("counter").textContent = String(step + 1).padStart(2, "0");
    el("bar").style.width = ((step + 1) / TOTAL * 100) + "%";
    el("qtext").textContent = item.q;

    var box = el("options");
    box.textContent = "";
    item.o.forEach(function (text, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "opt";
      var key = document.createElement("span");
      key.className = "key";
      key.setAttribute("aria-hidden", "true");
      key.textContent = "ABCD".charAt(i);
      var span = document.createElement("span");
      span.textContent = text;
      b.appendChild(key);
      b.appendChild(span);
      b.addEventListener("click", function () { choose(i); });
      box.appendChild(b);
    });
    el("live").textContent = el("progress").textContent + ". " + item.q;
  }

  function renderResult() {
    var t = T(), p = t.personas[persona];
    el("resultLabel").textContent = t.resultLabel;
    el("rare").textContent = t.rare;
    el("rare").hidden = !p.rare;
    el("pName").textContent = p.name;
    el("pDesc").textContent = p.desc;
    el("sigLabel").textContent = t.sigLabel;
    el("pSig").textContent = p.sig;
    el("againBtn").textContent = t.again;
    el("bar").style.width = "100%";

    el("lxA").textContent = t.axisX[0]; el("lxB").textContent = t.axisX[1];
    el("lyA").textContent = t.axisY[0]; el("lyB").textContent = t.axisY[1];
    el("lxA").className = score.x < 0 ? "on" : "";
    el("lxB").className = score.x > 0 ? "on" : "";
    el("lyA").className = score.y < 0 ? "on" : "";
    el("lyB").className = score.y > 0 ? "on" : "";
    el("dotX").style.left = (50 + (score.x / MAX) * 46) + "%";
    el("dotY").style.left = (50 + (score.y / MAX) * 46) + "%";
    renderShareRow();
  }

  function iconButton(kind, label, onClick) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "icon-btn";
    b.setAttribute("aria-label", label);
    b.setAttribute("title", label);
    var svg = '<svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">' + ICONS[kind] + "</svg>";
    b.innerHTML = svg;                      /* trusted literal from ICONS */
    b.addEventListener("click", onClick);
    return b;
  }

  function renderShareRow() {
    var t = T(), row = el("shareRow");
    row.textContent = "";
    row.appendChild(iconButton("download", t.aria.download, downloadImage));

    var url = pageUrl(), text = shareText();
    /* Native sheet replaces the per-network links on touch devices only. */
    var nativeOk = !!navigator.share && window.matchMedia("(pointer: coarse)").matches;
    if (nativeOk) {
      row.appendChild(iconButton("share", t.aria.share, function () {
        navigator.share({ title: t.docTitle, text: text, url: url })["catch"](function () {});
      }));
    } else {
      var open = function (href) { window.open(href, "_blank", "noopener,noreferrer"); };
      row.appendChild(iconButton("telegram", t.aria.telegram, function () {
        open("https://t.me/share/url?url=" + encodeURIComponent(url) + "&text=" + encodeURIComponent(text));
      }));
      row.appendChild(iconButton("x", t.aria.x, function () {
        open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(text) + "&url=" + encodeURIComponent(url));
      }));
      row.appendChild(iconButton("whatsapp", t.aria.whatsapp, function () {
        open("https://wa.me/?text=" + encodeURIComponent(text + " " + url));
      }));
    }
    row.appendChild(iconButton("copy", t.aria.copy, copyLink));
  }

  function render() {
    renderChrome();
    if (current === "intro") { renderIntro(); }
    else if (current === "quiz") { renderQuestion(); }
    else { renderResult(); }
  }

  /* ------------------------------------------------------------- flow */
  function transition(fn) {
    var node = screens.quiz;
    locked = true;
    node.classList.add("fading");
    window.setTimeout(function () {
      fn();
      node.classList.remove("fading");
      locked = false;
    }, 170);
  }

  function choose(index) {
    if (locked) { return; }
    var v = VECTORS[step][index];
    score.x += v.x;
    score.y += v.y;
    step += 1;
    transition(step < TOTAL ? renderQuestion : finish);
  }

  function finish() {
    persona = resolve(score.x, score.y);
    el("note").textContent = "";
    show("result");
    renderResult();
    el("pName").focus();
  }

  function reset() { step = 0; score.x = 0; score.y = 0; persona = null; }

  /* ------------------------------------------------------ copy / share */
  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:-9999px";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function copyLink() {
    var text = shareText() + " " + pageUrl();
    var done = function (ok) { el("note").textContent = ok ? T().copied : T().copyFail; };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { done(true); },
        function () { done(legacyCopy(text)); });
    } else {
      done(legacyCopy(text));
    }
  }

  /* --------------------------------------------------- canvas export */
  var W = 1080, H = 1350;

  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  /* Manual letter-spacing: ctx.letterSpacing is not universally supported. */
  function tracked(g, text, cx, y, sp) {
    var i, total = 0, chars = Array.from(text);
    for (i = 0; i < chars.length; i++) { total += g.measureText(chars[i]).width + sp; }
    total -= sp;
    var x = cx - total / 2;
    for (i = 0; i < chars.length; i++) {
      g.fillText(chars[i], x, y);
      x += g.measureText(chars[i]).width + sp;
    }
  }

  function wrap(g, text, maxW) {
    var words = text.split(" "), lines = [], line = "";
    for (var i = 0; i < words.length; i++) {
      var test = line ? line + " " + words[i] : words[i];
      if (g.measureText(test).width > maxW && line) { lines.push(line); line = words[i]; }
      else { line = test; }
    }
    if (line) { lines.push(line); }
    return lines;
  }

  function meter(g, x, y, w, value) {
    g.strokeStyle = "rgba(255,255,255,.12)";
    g.lineWidth = 8;
    g.lineCap = "round";
    g.beginPath(); g.moveTo(x + 4, y); g.lineTo(x + w - 4, y); g.stroke();
    g.strokeStyle = "rgba(255,255,255,.24)";
    g.lineWidth = 2; g.lineCap = "butt";
    g.beginPath(); g.moveTo(x + w / 2, y - 11); g.lineTo(x + w / 2, y + 11); g.stroke();
    var dx = x + w / 2 + (value / MAX) * (w / 2 - 10);
    g.fillStyle = "rgba(232,200,122,.20)";
    g.beginPath(); g.arc(dx, y, 22, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#F5DFA8";
    g.beginPath(); g.arc(dx, y, 11, 0, Math.PI * 2); g.fill();
  }

  function paint() {
    var t = T(), p = t.personas[persona];
    var c = document.createElement("canvas");
    c.width = W; c.height = H;
    var g = c.getContext("2d");
    var SANS = "'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif";
    var SERIF = "'Playfair Display',Georgia,'Times New Roman',serif";

    var bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#12203a"); bg.addColorStop(.42, "#0A1220"); bg.addColorStop(1, "#050A14");
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    var glow = g.createRadialGradient(W / 2, 0, 0, W / 2, 0, W * .95);
    glow.addColorStop(0, "rgba(60,96,136,.42)"); glow.addColorStop(1, "rgba(60,96,136,0)");
    g.fillStyle = glow; g.fillRect(0, 0, W, H);

    roundRect(g, 54, 54, W - 108, H - 108, 36);
    g.strokeStyle = "rgba(232,200,122,.22)"; g.lineWidth = 2; g.stroke();

    var x = 128, w = W - 256, y = 168;
    g.textBaseline = "alphabetic";
    g.textAlign = "left";

    g.fillStyle = "#E8C87A";
    g.font = "600 24px " + SANS;
    tracked(g, t.brand, W / 2, y, 8);
    y += 96;

    if (p.rare) {
      g.font = "700 22px " + SANS;
      var bw = 0, ch = Array.from(t.rare);
      for (var i = 0; i < ch.length; i++) { bw += g.measureText(ch[i]).width + 7; }
      bw += 56;
      roundRect(g, W / 2 - bw / 2, y - 34, bw, 50, 25);
      g.fillStyle = "rgba(232,200,122,.10)"; g.fill();
      g.strokeStyle = "rgba(232,200,122,.35)"; g.lineWidth = 1.5; g.stroke();
      g.fillStyle = "#F5DFA8";
      tracked(g, t.rare, W / 2, y, 7);
      y += 92;
    }

    var size = 96;
    g.textAlign = "center";
    do { g.font = "700 " + size + "px " + SERIF; size -= 4; }
    while (g.measureText(p.name).width > w && size > 40);
    g.fillStyle = "#EBCB80";
    g.fillText(p.name, W / 2, y);
    y += 74;

    g.textAlign = "left";
    g.font = "400 33px " + SANS;
    g.fillStyle = "rgba(255,255,255,.82)";
    wrap(g, p.desc, w).forEach(function (line) { g.fillText(line, x, y); y += 50; });

    y += 26;
    g.strokeStyle = "rgba(255,255,255,.12)"; g.lineWidth = 1;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + w, y); g.stroke();
    y += 52;

    g.fillStyle = "#E8C87A";
    g.font = "600 21px " + SANS;
    g.textAlign = "left";
    var sx = x;
    Array.from(t.sigLabel).forEach(function (chr) {
      g.fillText(chr, sx, y); sx += g.measureText(chr).width + 6;
    });
    y += 46;
    g.font = "italic 400 31px " + SANS;
    g.fillStyle = "#F5DFA8";
    wrap(g, p.sig, w).forEach(function (line) { g.fillText(line, x, y); y += 46; });

    y = H - 300;
    g.font = "600 20px " + SANS;
    [[t.axisX, score.x], [t.axisY, score.y]].forEach(function (pair) {
      var labels = pair[0], value = pair[1];
      g.textAlign = "left";
      g.fillStyle = value < 0 ? "#E8C87A" : "rgba(255,255,255,.55)";
      g.fillText(labels[0], x, y);
      g.textAlign = "right";
      g.fillStyle = value > 0 ? "#E8C87A" : "rgba(255,255,255,.55)";
      g.fillText(labels[1], x + w, y);
      meter(g, x, y + 32, w, value);
      y += 100;
    });

    g.textAlign = "center";
    g.font = "600 26px " + SANS;
    g.fillStyle = "rgba(232,200,122,.75)";
    tracked(g, "efsanebaskan", W / 2, H - 96, 6);

    return c;
  }

  function downloadImage() {
    var note = el("note");
    var go = function () {
      var canvas;
      try { canvas = paint(); } catch (e) { note.textContent = T().imgFail; return; }
      canvas.toBlob(function (blob) {
        if (!blob) { note.textContent = T().imgFail; return; }
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = "efsane-baskan-" + persona + ".png";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        note.textContent = T().shared;
      }, "image/png");
    };
    /* Canvas takes no part in CSS font loading, so the webfonts must be
       resolved before drawing or Turkish glyphs fall back mid-render. */
    if (document.fonts && document.fonts.ready) {
      var want = ["700 96px 'Playfair Display'", "400 33px 'Inter'", "italic 400 31px 'Inter'"];
      var loads = want.map(function (f) { return document.fonts.load(f, "İşğıÖÇÜ"); });
      Promise.all(loads)["catch"](function () {})
        .then(function () { return document.fonts.ready; })["catch"](function () {})
        .then(go, go);
    } else { go(); }
  }

  /* ------------------------------------------------------------ events */
  el("lang").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-lang]");
    if (!b) { return; }
    var next = b.getAttribute("data-lang");
    if (next === lang) { return; }
    lang = next;
    el("note").textContent = "";
    render();                          /* re-renders in place; step/score kept */
  });

  el("startBtn").addEventListener("click", function () {
    reset();
    show("quiz");
    renderQuestion();
    el("qtext").focus();
  });

  el("againBtn").addEventListener("click", function () {
    reset();
    el("note").textContent = "";
    show("intro");
    renderIntro();
    el("startBtn").focus();
  });

  renderChrome();
  renderIntro();
})();
</script>
</body>
</html>
